<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word ローカルエディタ</title>
<!--
  Word ローカルエディタ
  - ブラウザのみで動作（ネットワーク通信なし・外部ライブラリなし）
  - .docx / .docm / .dotx を開いて編集し .docx で保存（ヘッダー・フッター・用紙設定などは元のまま残す）
  - .doc（Word 97-2003 バイナリ）・RTF・HTML / MHT 形式の .doc を読み込んで編集
  - .doc での保存は Word 97-2003 互換の RTF 形式（Word / LibreOffice で .doc として開ける）
  - ZIP の展開/圧縮はブラウザ標準の DecompressionStream / CompressionStream を使用
-->
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#6b7280;--line:#d8dde3;--head:#f3f4f6;--sel:#2563eb;--selbg:#e3edff;--tool:#f8fafc;--err:#b91c1c;--accent:#2b579a;--canvas:#e9ecef;--shadow:0 6px 24px rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){:root{--bg:#1b1d21;--fg:#e6e6e6;--muted:#9aa0a6;--line:#363b42;--head:#25282d;--sel:#60a5fa;--selbg:#1e3350;--tool:#202328;--err:#f87171;--accent:#3d6db5;--canvas:#111316;--shadow:0 6px 24px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
header{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:6px 8px;background:var(--tool);border-bottom:1px solid var(--line)}
header .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
button,select,input{font:inherit;color:var(--fg)}
button{padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--sel)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.on{background:var(--selbg);border-color:var(--sel)}
button.ic{min-width:30px;padding:4px 7px}
select,input[type=number],input[type=text]{padding:3px 5px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
#sStyle{width:110px}#sFont{width:130px}#sSize{width:64px}
.clr{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--bg)}
.clr button{border:0;border-radius:0;padding:4px 7px}
.clr input{width:24px;height:26px;padding:0;border:0;border-left:1px solid var(--line);background:var(--bg);cursor:pointer}
#fname{color:var(--muted);margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:32ch}
#findBar{display:none;gap:6px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--tool);flex-wrap:wrap}
#findBar.on{display:flex}
#findBar input[type=text]{width:180px}
#wrap{flex:1;overflow:auto;background:var(--canvas);position:relative}
#paper{background:#fff;margin:24px auto;box-shadow:var(--shadow);outline:none;width:var(--pw,595pt);min-height:var(--ph,842pt);padding:var(--pt,72pt) var(--pr,72pt) var(--pb,72pt) var(--pl,72pt)}
#imgBox{position:absolute;pointer-events:none;outline:2px solid var(--sel);display:none}
#imgBox i{position:absolute;right:-7px;bottom:-7px;width:13px;height:13px;background:#fff;border:2px solid var(--sel);border-radius:2px;pointer-events:auto;cursor:nwse-resize;touch-action:none}
footer{display:flex;gap:12px;padding:3px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;background:var(--tool)}
footer #msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer #msg.err{color:var(--err)}
#drop{position:fixed;inset:0;background:rgba(37,99,235,.12);border:3px dashed var(--sel);display:none;align-items:center;justify-content:center;font-size:20px;z-index:50;pointer-events:none}
#drop.on{display:flex}
.menu{position:fixed;z-index:60;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:4px 0;min-width:190px;display:none}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:5px 14px}
.menu button:hover{background:var(--selbg)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .form{padding:6px 12px;display:grid;grid-template-columns:auto 70px;gap:6px 8px;align-items:center}
.menu .form button{grid-column:1/3;text-align:center;border:1px solid var(--line);border-radius:4px}

/* ---- 文書 ---- */
.doc{color:#000;white-space:pre-wrap;overflow-wrap:break-word;tab-size:42pt;line-height:normal;text-align:left}
.doc :is(p,h1,h2,h3,h4,h5,h6){margin:0}
.doc ul,.doc ol{margin:0;padding-left:2em}
.doc li{margin-left:0!important;text-indent:0!important}
.doc table{border-collapse:collapse;margin:0}
.doc td,.doc th{border:.5pt solid #000;padding:0 5.4pt;vertical-align:top;min-width:14px;font-weight:inherit;text-align:inherit}
.doc table.nob>*>tr>td,.doc table.nob>*>tr>th{border:1px dashed #c3c8ce}
.doc img{max-width:100%;height:auto;vertical-align:baseline}
.doc a{color:#0563C1;text-decoration:underline}
.doc sup,.doc sub{font-size:.65em}
.doc .page-break{display:block;height:0;border-top:1px dashed #8a8f98;margin:12px 0;position:relative;user-select:none;white-space:normal;cursor:default}
.doc .page-break::after{content:"改ページ";position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:#fff;color:#8a8f98;font:11px/14px sans-serif;padding:0 6px}
.doc .textbox{border:1px dashed #9aa0a6;padding:4px;margin:2px 0}
#probe{position:absolute;left:-10000px;top:0;visibility:hidden;width:400px;pointer-events:none}
@media print{
  header,footer,#findBar,#imgBox,.menu,#drop{display:none!important}
  html,body{height:auto;display:block;background:#fff}
  #wrap{overflow:visible;background:#fff}
  #paper{box-shadow:none;margin:0;padding:0;width:auto;min-height:0;zoom:1!important}
  .doc .page-break{border:0;margin:0;break-after:page}
  .doc .page-break::after{display:none}
  .doc table.nob>*>tr>td,.doc table.nob>*>tr>th{border:none}
}
</style>
<style id="docCss"></style>
</head>

  <span class="sep"></span>

  </select>

</header>
<div id="findBar">

<script>
'use strict';
/* =========================================================================
   基本ユーティリティ
   ========================================================================= */
const $=s=>document.querySelector(s);
const enc=new TextEncoder(), dec=new TextDecoder();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const xesc=s=>esc(String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\uFFFE\uFFFF]/g,''));
const px=v=>parseFloat(v)||0;
const tw=p=>Math.round(p*15);            // CSS px → twip
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function msg(t,err){const m=$('#msg');m.textContent=t;m.classList.toggle('err',!!err);}
function hexOf(c){
  const m=/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s/]+([\d.]+%?))?\s*\)/.exec(c||'');
  if(!m) return null;
  if(m[4]!=null&&parseFloat(m[4])===0) return null;
  return [m[1],m[2],m[3]].map(v=>clamp(Math.round(+v),0,255).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(String(s).replace(/[^A-Za-z0-9+/=]/g,''));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function latin1(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return s;}
function decodeText(u8,label){try{return new TextDecoder(label||'utf-8').decode(u8);}catch(_){return dec.decode(u8);}}
const toCss=o=>Object.entries(o).map(([k,v])=>k+':'+v).join(';');
function setStyle(el,o){for(const k in o) el.style.setProperty(k,o[k]);}

/* =========================================================================
   XML / 名前空間
   ========================================================================= */
const NS={
  w:'http://schemas.openxmlformats.org/wordprocessingml/2006/main',
  r:'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
  wp:'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing',
  a:'http://schemas.openxmlformats.org/drawingml/2006/main',
  pic:'http://schemas.openxmlformats.org/drawingml/2006/picture',
  pr:'http://schemas.openxmlformats.org/package/2006/relationships',
  ct:'http://schemas.openxmlformats.org/package/2006/content-types',
  v:'urn:schemas-microsoft-com:vml',
  mc:'http://schemas.openxmlformats.org/markup-compatibility/2006',
  m:'http://schemas.openxmlformats.org/officeDocument/2006/math'
};
const RT='http://schemas.openxmlformats.org/officeDocument/2006/relationships/';
const XH='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n';
const STRICT=[
  ['http://purl.oclc.org/ooxml/wordprocessingml/main',NS.w],
  ['http://purl.oclc.org/ooxml/officeDocument/relationships',NS.r],
  ['http://purl.oclc.org/ooxml/drawingml/wordprocessingDrawing',NS.wp],
  ['http://purl.oclc.org/ooxml/drawingml/main',NS.a],
  ['http://purl.oclc.org/ooxml/drawingml/picture',NS.pic]
];
function xmlText(u8){let s=dec.decode(u8);if(s.includes('purl.oclc.org/ooxml'))for(const [a,b] of STRICT)s=s.split(a).join(b);return s;}
function parseXml(s){
  const d=new DOMParser().parseFromString(s,'application/xml');
  if(d.getElementsByTagName('parsererror').length) throw new Error('XML の解析に失敗しました');
  return d;
}
const ser=n=>new XMLSerializer().serializeToString(n);
const kids=el=>el?[...el.children]:[];
const ln=el=>el.localName;
function ch(el,name,ns=NS.w){if(!el)return null;for(const k of el.children)if(k.localName===name&&k.namespaceURI===ns)return k;return null;}
function wv(el,attr='val'){return el&&el.hasAttributeNS(NS.w,attr)?el.getAttributeNS(NS.w,attr):null;}
const onoff=el=>{const v=wv(el);return !(v==='0'||v==='false'||v==='off');};
const desc=(el,name,ns=NS.w)=>el?[...el.getElementsByTagNameNS(ns,name)]:[];

/* =========================================================================
   ZIP 読み書き（ブラウザ標準の圧縮ストリームを使用）
   ========================================================================= */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function streamBytes(u8,ts){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ts)).arrayBuffer());}
const inflateRaw=u8=>streamBytes(u8,new DecompressionStream('deflate-raw'));
const deflateRaw=u8=>streamBytes(u8,new CompressionStream('deflate-raw'));
async function unzip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let e=u8.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('ZIP 形式ではありません');
  const cnt=dv.getUint16(e+10,true), cdOff=dv.getUint32(e+16,true);
  const files=new Map(); let p=cdOff;
  for(let i=0;i<cnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('ZIP の中央ディレクトリが壊れています');
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nlen));
    p+=46+nlen+elen+clen;
    if(name.endsWith('/')) continue;
    const ds=lho+30+dv.getUint16(lho+26,true)+dv.getUint16(lho+28,true);
    const raw=u8.subarray(ds,ds+csize);
    if(method===0) files.set(name,raw.slice());
    else if(method===8) files.set(name,await inflateRaw(raw));
    else throw new Error('未対応の圧縮方式: '+method);
  }
  return files;
}
async function zipBuild(entries,type){
  const parts=[], cd=[]; let off=0;
  const canDeflate=typeof CompressionStream!=='undefined';
  for(const en of entries){
    const nb=enc.encode(en.name), data=en.data, crc=crc32(data);
    let comp=data, method=0;
    if(canDeflate&&data.length>128&&!/\.(png|jpe?g|gif|zip)$/i.test(en.name)){
      try{const c=await deflateRaw(data); if(c.length<data.length){comp=c;method=8;}}catch(_){}
    }
    const lh=new Uint8Array(30+nb.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,method,true);
    lv.setUint16(10,0,true);lv.setUint16(12,0x21,true);lv.setUint32(14,crc,true);lv.setUint32(18,comp.length,true);
    lv.setUint32(22,data.length,true);lv.setUint16(26,nb.length,true);lh.set(nb,30);
    const ch_=new Uint8Array(46+nb.length), cv=new DataView(ch_.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);
    cv.setUint16(10,method,true);cv.setUint16(12,0,true);cv.setUint16(14,0x21,true);cv.setUint32(16,crc,true);
    cv.setUint32(20,comp.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,nb.length,true);cv.setUint32(42,off,true);ch_.set(nb,46);
    parts.push(lh,comp); cd.push(ch_); off+=lh.length+comp.length;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array(22), ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,entries.length,true);ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,off,true);
  return new Blob([...parts,...cd,end],{type});
}

/* =========================================================================
   OPC パッケージ（パーツ・リレーションシップ）
   ========================================================================= */
const dirOf=p=>p.slice(0,p.lastIndexOf('/')+1);
function relsPathOf(p){const i=p.lastIndexOf('/');return p.slice(0,i+1)+'_rels/'+p.slice(i+1)+'.rels';}
function resolvePath(base,t){
  if(t.startsWith('/')) return t.slice(1);
  const out=[];
  for(const s of (base+t).split('/')){if(s==='..')out.pop();else if(s!=='.'&&s!=='')out.push(s);}
  return out.join('/');
}
function relativePath(from,to){
  const a=dirOf(from).split('/').filter(Boolean), b=to.split('/');
  let i=0; while(i<a.length&&i<b.length-1&&a[i]===b[i]) i++;
  return '../'.repeat(a.length-i)+b.slice(i).join('/');
}
function readRels(files,path,base){
  const u=files.get(path); if(!u) return [];
  try{
    const d=parseXml(xmlText(u));
    return [...d.getElementsByTagNameNS(NS.pr,'Relationship')].map(r=>{
      const mode=r.getAttribute('TargetMode')||'', target=r.getAttribute('Target')||'';
      return {id:r.getAttribute('Id'),type:r.getAttribute('Type')||'',target,mode,abs:mode==='External'?target:resolvePath(base,target)};
    });
  }catch(_){return [];}
}
const relOf=(rels,t)=>rels.find(r=>r.type.endsWith('/'+t)&&r.mode!=='External');
function xmlOf(files,path){if(!path||!files.has(path))return null;try{return parseXml(xmlText(files.get(path)));}catch(_){return null;}}

/* =========================================================================
   画像ストア（blob URL ⇔ バイト列）
   ========================================================================= */
const IMG=new Map();
const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',bmp:'image/bmp',webp:'image/webp',svg:'image/svg+xml',emf:'image/x-emf',wmf:'image/x-wmf',tif:'image/tiff',tiff:'image/tiff',ico:'image/x-icon'};
const VIEWABLE=new Set(['png','jpg','jpeg','gif','bmp','webp','svg','ico']);

  const body=ch(doc.documentElement,'body');
  const sect=body?kids(body).filter(e=>ln(e)==='sectPr').pop():null;
  return {files,name,handle:handle||null,kind,main,rels,S,N,stylesPath,numPath,body,
    sectPr:sect?ser(sect):null,page:pageFromSect(sect),usedPs:new Set(),modified:false};

function makeRtfWriter(imgs){

function runsRtf(nodes,R){
  const items=collectRuns(nodes,{});
  const props=p=>{
    const f=fams(p.ff), asc=R.font(f[0]), ea=R.font(f[1]||f[0]);
    let s=`\\f${asc}\\fs${p.sz||21}`+(p.b?'\\b':'\\b0')+(p.i?'\\i':'\\i0');
    if(p.u) s+='\\ul';
    if(p.s) s+='\\strike';
    if(p.color&&p.color!=='000000') s+='\\cf'+R.color(p.color);
    if(p.bg){const c=R.color(p.bg);s+=`\\chcbpat${c}\\cb${c}`;}
    if(p.va==='superscript') s+='\\super'; else if(p.va==='subscript') s+='\\sub';
    return {s,asc,ea};
  };
  let out='', link=null, buf='';
  const close=()=>{
    if(!buf) return;
    if(link) out+=`{\\field{\\*\\fldinst HYPERLINK "${rtfEsc(link.getAttribute('href')).replace(/"/g,'')}"}{\\fldrslt ${buf}}}`;
    else out+=buf;
    buf='';
  };
  for(const it of items){
    if(it.link!==link){close();link=it.link||null;}
    if(it.k==='t'){const pr=props(it.p);const jp=/[^\x00-\x7F]/.test(it.t);buf+=`{${pr.s}${jp&&pr.ea!==pr.asc?'\\f'+pr.ea:''} ${rtfEsc(it.t)}}`;}

    else if(it.k==='br') buf+='\\line ';
    else if(it.k==='pb') buf+='\\page ';
    else if(it.k==='img') buf+=imgRtf(it.el,R);
  }

}
function imgRtf(el,R){

  const d=info.data, HX='0123456789abcdef', parts=[];
  for(let i=0;i<d.length;i+=64){let s='';for(let j=i;j<Math.min(i+64,d.length);j++)s+=HX[d[j]>>4]+HX[d[j]&15];parts.push(s);}

function paraRtf(el,nodes,R,o){

  const j=JC(cs.textAlign); s+=j==='center'?'\\qc':j==='right'?'\\qr':j==='both'?'\\qj':'\\ql';

    const left=tw(indentPx(el)), fi=tw(px(cs.textIndent)), ri=tw(px(cs.marginRight));
    if(left) s+='\\li'+left;

// 段落（終端の \par なし）の配列を返す。改ページは {pb}、表は {tbl}
function blocksRtf(container,R,o={}){
  const out=[]; let grp=[];
  const flush=()=>{if(grp.length&&grp.some(meaningful))out.push(paraRtf(container,grp,R,{...o,group:true}));grp=[];};
  for(const n of container.childNodes){
    if(n.nodeType===3){grp.push(n);continue;}
    if(n.nodeType!==1||SKIP.has(n.tagName)) continue;
    if(n.classList.contains('page-break')){flush();out.push({pb:true});continue;}
    if(!isBlock(n)){grp.push(n);continue;}
    flush(); out.push(...blockRtf(n,R,o));
  }
  flush();
  return out;
}
function blockRtf(n,R,o){
  const t=n.tagName;
  if(getComputedStyle(n).display==='none') return [];
  if(t==='UL'||t==='OL') return listRtf(n,R,0,o);
  if(t==='TABLE') return o.inTable?flatTable(n,R,o):[{tbl:tableRtf(n,R)}];
  if(t==='HR') return [`\\pard\\plain${o.inTable?'\\intbl':''}\\brdrb\\brdrs\\brdrw10\\brsp20 `];
  if(t==='TR'||t==='TBODY'||t==='THEAD'||t==='TFOOT'||hasBlockChild(n)) return blocksRtf(n,R,o);
  return [paraRtf(n,[...n.childNodes],R,o)];
}
function flatTable(t,R,o){const out=[];for(const c of t.querySelectorAll('td,th'))out.push(...blocksRtf(c,R,o).filter(x=>typeof x==='string'));return out;}
function listRtf(list,R,lvl,o){
  const out=[], fmt=fmtOf(list);
  let n=list.tagName==='OL'&&list.start>0?list.start:1;
  for(const c of list.childNodes){
    if(c.nodeType!==1){if(c.nodeType===3&&c.data.trim())out.push(paraRtf(list,[c],R,{...o,group:true}));continue;}
    if(c.tagName==='UL'||c.tagName==='OL'){out.push(...listRtf(c,R,Math.min(lvl+1,8),o));continue;}
    if(c.tagName!=='LI'){out.push(...blockRtf(c,R,o));continue;}
    const list_={lvl,marker:listMarker(fmt,n++,lvl)};
    let grp=[], first=true;
    const flush=()=>{if(grp.length&&(first||grp.some(meaningful))){out.push(paraRtf(c,grp,R,first?{...o,list:list_}:{...o,group:true}));first=false;}grp=[];};
    for(const k of c.childNodes){
      if(k.nodeType===1&&(k.tagName==='UL'||k.tagName==='OL')){flush();first=false;out.push(...listRtf(k,R,Math.min(lvl+1,8),o));continue;}
      if(isBlock(k)){
        if(first&&!grp.some(meaningful)&&!hasBlockChild(k)&&/^(P|DIV|H\d)$/.test(k.tagName)){grp=[];out.push(paraRtf(k,[...k.childNodes],R,{...o,list:list_}));first=false;}
        else{flush();out.push(...blockRtf(k,R,o));}
        continue;
      }
      grp.push(k);
    }
    flush();
    if(first) out.push(paraRtf(c,[],R,{...o,list:list_}));
  }
  return out;
}
function tableRtf(t,R){
  const g=tableGrid(t); if(!g) return '';

    let def='\\trowd\\trgaph108\\trleft0'+(g.center?'\\trqc':''), edge=0, body='';

      if(vm==='restart') def+='\\clvmgf'; else if(vm==='continue') def+='\\clvmrg';
      if(lk.va) def+=lk.va==='center'?'\\clvertalc':'\\clvertalb';
      if(!g.nob) def+='\\clbrdrt\\brdrs\\brdrw10\\clbrdrl\\brdrs\\brdrw10\\clbrdrb\\brdrs\\brdrw10\\clbrdrr\\brdrs\\brdrw10';

/* ---- 表 ---- */
function contentWidthPt(){return (D.page.w-D.page.l-D.page.r)/20;}
function insertTable(rows,cols){
  rows=clamp(rows|0,1,100); cols=clamp(cols|0,1,30);
  const w=(contentWidthPt()/cols).toFixed(2);
  let h='<table><tbody>';
  for(let r=0;r<rows;r++){h+='<tr>';for(let c=0;c<cols;c++)h+=`<td style="width:${w}pt"><p${r+c?'':' id="wle-new-cell"'}><br></p></td>`;h+='</tr>';}
  h+='</tbody></table><p><br></p>';
  exec('insertHTML',h);
  const first=paper.querySelector('#wle-new-cell');
  if(first){first.removeAttribute('id');const r=document.createRange();r.setStart(first,0);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);savedRange=r.cloneRange();}
}
function newCell(tag){const c=document.createElement(tag||'td');c.innerHTML='<p><br></p>';return c;}
function tblOp(op,td){
  const tr=td.parentElement, t=td.closest('table'); if(!t) return;
  pushUndo();
  const idx=td.cellIndex;
  switch(op){
    case 'rowAbove': case 'rowBelow':{
      const nr=document.createElement('tr');
      for(const c of tr.cells){const nc=newCell(c.tagName);if(c.colSpan>1)nc.colSpan=c.colSpan;if(c.style.width)nc.style.width=c.style.width;nr.append(nc);}
      op==='rowAbove'?tr.before(nr):tr.after(nr); break;
    }
    case 'colLeft': case 'colRight':{
      for(const r of t.rows){if(r.closest('table')!==t)continue;const ref=r.cells[Math.min(idx,r.cells.length-1)];const nc=newCell(ref?ref.tagName:'td');if(!ref)r.append(nc);else op==='colLeft'?ref.before(nc):ref.after(nc);}
      t.querySelector('colgroup')?.remove(); t.style.width='';
      for(const c of t.querySelectorAll('td,th')) c.style.width='';
      break;
    }
    case 'delRow': tr.remove(); if(!t.rows.length) t.remove(); break;
    case 'delCol':
      for(const r of [...t.rows]){if(r.closest('table')!==t)continue;const c=r.cells[Math.min(idx,r.cells.length-1)];if(c)c.remove();if(!r.cells.length)r.remove();}
      t.querySelector('colgroup')?.remove();
      if(!t.rows.length) t.remove(); break;
    case 'delTable': t.remove(); break;
    case 'border': t.classList.toggle('nob'); break;
    case 'shade':{const c=prompt('セルの背景色（例: #FFF2CC、空欄で解除）',td.style.backgroundColor?'#'+hexOf(td.style.backgroundColor):'#FFF2CC');if(c===null){H.u.pop();return;}td.style.backgroundColor=c.trim();break;}
  }
  if(!paper.firstChild) paper.innerHTML='<p><br></p>';
  afterEdit();
}

/* ---- 検索と置換 ---- */
function textNodes(){const out=[],w=document.createTreeWalker(paper,NodeFilter.SHOW_TEXT);while(w.nextNode())out.push(w.currentNode);return out;}
function findNext(){
  const q=$('#fq').value; if(!q) return false;
  const cs=$('#fcase').checked, nq=cs?q:q.toLowerCase();
  const nodes=textNodes(); if(!nodes.length) return false;
  const s=getSelection();
  let si=0, so=0;
  if(s.rangeCount&&inPaper(s.focusNode)){const r=s.getRangeAt(0);const i=nodes.indexOf(r.endContainer);if(i>=0){si=i;so=r.endOffset;}else{si=nodes.findIndex(n=>r.comparePoint(n,0)>0);if(si<0)si=0;}}
  for(let k=0;k<=nodes.length;k++){
    const i=(si+k)%nodes.length, n=nodes[i];
    const d=cs?n.data:n.data.toLowerCase();
    const p=d.indexOf(nq,k===0?so:0);
    if(p>=0){
      const r=document.createRange(); r.setStart(n,p); r.setEnd(n,p+q.length);
      paper.focus({preventScroll:true}); s.removeAllRanges(); s.addRange(r); savedRange=r.cloneRange();
      const b=r.getBoundingClientRect(), w=wrapEl.getBoundingClientRect();
      if(b.top<w.top+40||b.bottom>w.bottom-40) wrapEl.scrollTop+=b.top-w.top-w.height/3;
      return true;
    }
  }
  msg('見つかりませんでした: '+q); return false;
}
function replaceOne(){
  const q=$('#fq').value; if(!q) return;
  const s=getSelection(); const cs=$('#fcase').checked;
  if(s.rangeCount&&inPaper(s.anchorNode)){const t=s.toString();if(cs?t===q:t.toLowerCase()===q.toLowerCase()){pushUndo();const r=s.getRangeAt(0);r.deleteContents();const tn=document.createTextNode($('#fr').value);r.insertNode(tn);r.setStartAfter(tn);r.collapse(true);s.removeAllRanges();s.addRange(r);afterEdit();}}
  findNext();
}
function replaceAll(){
  const q=$('#fq').value; if(!q) return;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),$('#fcase').checked?'g':'gi');
  const rep=$('#fr').value; let cnt=0;
  const nodes=textNodes().filter(n=>{re.lastIndex=0;return re.test(n.data);});
  if(!nodes.length){msg('見つかりませんでした: '+q);return;}
  pushUndo();
  for(const n of nodes){n.data=n.data.replace(re,()=>{cnt++;return rep;});}
  afterEdit(); msg(cnt+' 件置換しました');
}
function openFind(replace){
  $('#findBar').classList.add('on');
  const s=getSelection(); const t=s.rangeCount&&inPaper(s.anchorNode)?s.toString():'';
  if(t&&t.length<100&&!t.includes('\n')) $('#fq').value=t;
  (replace?$('#fr'):$('#fq')).focus(); (replace?$('#fr'):$('#fq')).select();
}

function zoomVal(){const v=$('#sZoom').value;if(v==='fit'){const w=wrapEl.clientWidth-24;const pw=D?D.page.w/20*4/3:794;return clamp(w/pw,0.3,1);}return +v||1;}

   保存
   ========================================================================= */
function baseName(){return (D.name||'文書').replace(/\.(docx|docm|dotx|dotm|doc|dot|rtf|html?|mhtml?|txt)$/i,'');}
function outName(){return baseName()+(isMacro()?'.docm':'.docx');}
async function writeOut(blob,name,types,useHandle){
  if(useHandle&&D.handle&&D.handle.createWritable){
    const w=await D.handle.createWritable(); await w.write(blob); await w.close(); return {name:D.handle.name,handle:D.handle,over:true};
  }
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({suggestedName:name,types});
      const w=await h.createWritable(); await w.write(blob); await w.close();
      return {name:h.name,handle:h};
    }catch(e){if(e.name==='AbortError') return null;}
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  return {name,download:true};
}
const DOCX_TYPES=[{description:'Word 文書',accept:{'application/vnd.openxmlformats-officedocument.wordprocessingml.document':['.docx'],'application/vnd.ms-word.document.macroEnabled.12':['.docm']}}];
async function save(asNew){
  if(!D) return;
  try{
    msg('保存中…');
    const blob=await buildDocx();
    const over=!asNew&&D.kind==='docx'&&/\.(docx|docm)$/i.test(D.name||'');
    const r=await writeOut(blob,outName(),DOCX_TYPES,over);
    if(!r){msg('保存をキャンセルしました');return;}
    if(r.handle) D.handle=r.handle;
    D.name=r.name; D.kind='docx'; D.modified=false; updateUI();
    msg((r.over?'上書き保存しました: ':r.download?'ダウンロードしました: ':'保存しました: ')+r.name);
  }catch(e){console.error(e);msg('保存に失敗しました: '+e.message,true);}
}
async function saveDoc(){
  if(!D) return;
  try{
    msg('保存中…');
    const blob=await buildRtf();
    const r=await writeOut(blob,baseName()+'.doc',[{description:'Word 97-2003 互換文書',accept:{'application/msword':['.doc']}}],false);
    if(!r){msg('保存をキャンセルしました');return;}
    D.modified=false; updateUI();
    msg((r.download?'ダウンロードしました: ':'保存しました: ')+r.name+'（Word 97-2003 互換の RTF 形式）');
  }catch(e){console.error(e);msg('保存に失敗しました: '+e.message,true);}
}

/* =========================================================================
   ファイルを開く
   ========================================================================= */
async function openFile(file,handle){
  if(D&&D.modified&&!confirm('変更が保存されていません。破棄して開きますか？')) return;
  msg('読み込み中… '+file.name);
  const prev=D, oldUrls=[...IMG.keys()];
  try{
    const buf=await file.arrayBuffer(), u8=new Uint8Array(buf);
    let frag, note='読み込みました: '+file.name;
    if(u8[0]===0x50&&u8[1]===0x4B){
      frag=await openDocx(await unzip(buf),file.name,handle);
    }else if(u8[0]===0xD0&&u8[1]===0xCF&&u8[2]===0x11&&u8[3]===0xE0){
      const cfb=readCFB(u8);
      if(cfb.has('EncryptedPackage')) throw new Error('パスワードで保護されたファイルは開けません');
      frag=await docImport(cfb,file.name);
      note='Word 97-2003 文書を読み込みました（保存は .docx か、Word 互換の .doc 形式になります）';
    }else{
      const head=latin1(u8.subarray(0,2048));
      if(/^\s*\{\\rtf/.test(head)){frag=rtfImport(latin1(u8),file.name);note='RTF 文書を読み込みました（保存は .docx 形式になります）';}
      else if(/^\s*MIME-Version:|Content-Type:\s*multipart\/related/i.test(head)){frag=htmlImport(u8,file.name,true);note='Web 形式の文書を読み込みました';}
      else if(/<(html|body|p|div|table|!doctype)[\s>]/i.test(head)||/\.html?$/i.test(file.name)){frag=htmlImport(u8,file.name,false);note='HTML 形式の文書を読み込みました';}
      else if(/\.txt$/i.test(file.name)||!/[\x00-\x08]/.test(head)){frag=textImport(u8,file.name);note='テキストを読み込みました';}
      else throw new Error('対応していないファイル形式です');
    }
    setDoc(frag,oldUrls);
    msg(note);
  }catch(e){console.error(e);D=prev;msg('開けませんでした: '+e.message,true);}
}
async function openDialog(){
  if(window.showOpenFilePicker){
    try{
      const [h]=await window.showOpenFilePicker({types:[{description:'Word 文書',accept:{'application/vnd.openxmlformats-officedocument.wordprocessingml.document':['.docx','.docm','.dotx','.dotm'],'application/msword':['.doc','.dot'],'application/rtf':['.rtf'],'text/html':['.htm','.html','.mht','.mhtml'],'text/plain':['.txt']}}]});

    }catch(e){if(e.name==='AbortError')return;}
  }

}

  if(!force&&D&&D.modified&&!confirm('変更が保存されていません。破棄して新規作成しますか？')) return;

paper.addEventListener('keydown',e=>{
  if(e.isComposing) return;
  const mod=e.ctrlKey||e.metaKey;
  if(selImg&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();pushUndo();selImg.remove();selectImg(null);afterEdit();return;}
  if(mod&&e.key==='Enter'){e.preventDefault();insertPageBreak();return;}
  if(e.key==='Tab'&&!mod&&!e.altKey){
    const s=getSelection(); let n=s.anchorNode; n=n&&(n.nodeType===1?n:n.parentElement);
    const li=n&&n.closest('li'), td=n&&n.closest('td,th');
    if(li&&inPaper(li)){e.preventDefault();exec(e.shiftKey?'outdent':'indent');return;}
    if(td&&inPaper(td)){
      e.preventDefault();
      const cells=[...td.closest('table').querySelectorAll('td,th')].filter(c=>c.closest('table')===td.closest('table'));
      let i=cells.indexOf(td)+(e.shiftKey?-1:1);
      if(i>=cells.length&&!e.shiftKey){tblOp('rowBelow',cells[cells.length-1]);const all=[...td.closest('table').querySelectorAll('td,th')];i=cells.length;const c=all[i];if(c){const r=document.createRange();r.selectNodeContents(c);r.collapse(true);s.removeAllRanges();s.addRange(r);}return;}
      const c=cells[clamp(i,0,cells.length-1)]; const r=document.createRange(); r.selectNodeContents(c); r.collapse(true); s.removeAllRanges(); s.addRange(r); return;
    }
    e.preventDefault();
    if(e.shiftKey) exec('outdent'); else{pushUndo();document.execCommand('insertText',false,'\t');afterEdit();}
  }
});
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(e.key==='Escape'){hideMenus();if(selImg)selectImg(null);}
  if(!mod) return;
  if(k==='s'){e.preventDefault();save(e.shiftKey);return;}
  if(k==='o'){e.preventDefault();openDialog();return;}
  if(k==='f'){e.preventDefault();openFind(false);return;}
  if(k==='h'){e.preventDefault();openFind(true);return;}
  if(inField(e.target)) return;
  if(k==='z'&&!e.shiftKey){e.preventDefault();undo();return;}
  if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo();return;}
});
paper.addEventListener('paste',e=>{
  const dt=e.clipboardData; if(!dt) return;
  const html=dt.getData('text/html');
  const file=[...dt.files].find(f=>f.type.startsWith('image/'));
  if(file&&!html){e.preventDefault();insertImageFile(file);return;}
  if(html){
    e.preventDefault();
    const frag=sanitizeInto(html,src=>/^data:/i.test(src)?dataUrlToImg(src):(IMG.has(src)||/^(blob|https?):/i.test(src))?src:null);
    const div=document.createElement('div'); div.append(frag);
    pushUndo(); document.execCommand('insertHTML',false,div.innerHTML); afterEdit();
    return;
  }
  const txt=dt.getData('text/plain');
  if(txt){e.preventDefault();pushUndo();document.execCommand('insertText',false,txt.replace(/\r\n?/g,'\n'));afterEdit();}
});
let dragDepth=0;
window.addEventListener('dragenter',e=>{if(!e.dataTransfer.types.includes('Files'))return;dragDepth++;$('#drop').classList.add('on');});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop').classList.remove('on');});
window.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files'))e.preventDefault();});
window.addEventListener('drop',e=>{
  if(!e.dataTransfer.files.length) return;
  e.preventDefault(); dragDepth=0; $('#drop').classList.remove('on');
  const f=e.dataTransfer.files[0];
  if(/^image\//.test(f.type)){
    let at=null;
    if(document.caretRangeFromPoint) at=document.caretRangeFromPoint(e.clientX,e.clientY);
    else if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(e.clientX,e.clientY);if(p){at=document.createRange();at.setStart(p.offsetNode,p.offset);}}
    if(at&&!inPaper(at.startContainer)) at=null;
    insertImageFile(f,at);
  }else openFile(f);
});
window.addEventListener('beforeunload',e=>{if(D&&D.modified){e.preventDefault();e.returnValue='';}});
/* テスト・自動化用 */
window.docxEditor={open:(u8,name)=>openFile(new File([u8],name)),build:()=>buildDocx(),buildDoc:()=>buildRtf(),state:()=>D,paper};

newDoc(true);
if(innerWidth<760){$('#sZoom').value='fit';applyZoom();}
if(typeof DecompressionStream==='undefined') msg('このブラウザは圧縮ストリームに未対応です。最新の Chrome / Edge / Firefox / Safari をご利用ください。',true);
